<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jessica Deart — Links</title>
  <meta name="description" content="Jessica Deart, designer. Portfólio, Behance, Instagram, LinkedIn e contato.">
  <meta name="theme-color" content="#F2F2F2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --roxo: #6040C5;
      --branco: #F2F2F2;
      --marinho: #211D5D;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: var(--branco); }
    body {
      font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
      background: var(--branco);
      color: var(--marinho);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    img { display: block; max-width: 100%; }

    .pagina {
      width: 100%;
      max-width: 480px;
      padding: 32px 22px 48px;
    }

    /* ---------- Topo ---------- */
    .foto {
      width: min(86%, 380px);
      margin: 0 auto;
      animation: surgir 1.1s var(--ease) both;
    }
    .ola {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 700;
      margin-top: 12px;
      animation: subir .8s var(--ease) .2s both;
    }
    .sorriso { width: 22px; height: 22px; color: var(--roxo); transform: rotate(18deg); }
    .titulo-gif {
      width: min(100%, 360px);
      margin: 6px 0 0 -4px;
      animation: subir .8s var(--ease) .3s both;
    }
    .frase {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.55;
      margin-top: 10px;
      animation: subir .8s var(--ease) .4s both;
    }
    .frase em { font-style: normal; color: var(--roxo); }
    .circulada { position: relative; color: var(--roxo); white-space: nowrap; margin: 0 .3em; }
    .circulada svg {
      position: absolute;
      left: -11%; top: -36%;
      width: 122%; height: 172%;
      stroke-dasharray: 360;
      stroke-dashoffset: 360;
      animation: desenhar 1.2s var(--ease) 1.1s forwards;
      pointer-events: none;
    }

    /* ---------- Redes ---------- */
    .redes { margin-top: 44px; }
    .redes-titulo {
      font-size: clamp(16px, 5.3vw, 26px);
      white-space: nowrap;
      font-weight: 800;
      text-transform: uppercase;
      line-height: 1.08;
      letter-spacing: -.01em;
    }

    .links { list-style: none; display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
    .links a {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      padding: 10px 64px;
      border: 2px solid var(--roxo);
      border-radius: 999px;
      color: var(--marinho);
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      background: transparent;
      transition: background .3s, color .3s, transform .35s var(--ease), box-shadow .35s var(--ease);
      animation: subir .7s var(--ease) both;
      animation-delay: calc(.6s + var(--i) * .07s);
    }
    .icone {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--marinho);
      color: var(--branco);
      display: grid;
      place-items: center;
      transition: background .3s, transform .35s var(--ease);
    }
    .icone svg { width: 22px; height: 22px; }
    .links a:hover,
    .links a:focus-visible {
      background: var(--roxo);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 22px -12px rgba(96, 64, 197, .7);
      outline: none;
    }
    .links a:hover .icone,
    .links a:focus-visible .icone { background: #fff; color: var(--roxo); transform: translateY(-50%) rotate(-10deg); }
    .links a:active { transform: scale(.98); }

    .rodape { margin-top: 36px; text-align: center; font-size: 12px; font-weight: 600; opacity: .55; }

    @keyframes subir { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @keyframes surgir { from { opacity: 0; transform: scale(.88) rotate(-5deg); } to { opacity: 1; transform: none; } }
    @keyframes desenhar { to { stroke-dashoffset: 0; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
      .circulada svg { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>

</body>
